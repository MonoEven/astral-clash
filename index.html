  UI.storyBoon=function(){const s=this.g.v31Story;this.modal(`<h2 id="dialog-title">选一项战术，改变这一段旅程</h2><p class="field-note">能力持续至本次六章旅程结束；读档和重试不会丢失。每项最多三层。</p><div class="story-grid">${AC.STORY_BOONS.map(b=>`<button data-action="story-boon" data-value="${b.id}" ${s.boons[b.id]>=3?'disabled':''}><strong>${b.title}</strong><p>${b.desc}</p><small>已获得 ${s.boons[b.id]} / 3</small></button>`).join('')}</div><footer class="modal-footer"><button class="secondary" data-action="story-boon-skip">稍后选择 / Esc</button></footer>`,true,'story-boon');};
  UI.storyComplete=function(){const s=this.g.v31Story;this.modal(`<div class="story-dialogue"><span class="eyebrow">旅程完成 / 06 CHAPTERS</span><h2 id="dialog-title">星环重新点亮</h2><p>${AC.t('storyCompleteBody')}</p><p>击败 ${s.kills} 名敌人 · 收集 ${s.found.length} 项物资 · 获得 ${s.rewardTaken} 项战术<br>营灯重试 ${s.deaths} 次 · 坠落救援 ${s.falls} 次</p><footer class="modal-footer"><button class="launch" data-action="home">返回主菜单</button></footer></div>`,true,'story-complete');};
  UI.openShop=function(){const p=AC.V3.profile;this.modal(`<h2 id="dialog-title">星灯商店 · ${p.coins} 星尘</h2><p class="field-note">可选容错与操作奖励。不售卖基础伤害，也不要求购买才能通关。</p><div class="story-grid">${AC.V3.UPGRADES.map(b=>{const level=p.upgrades[b.id],cost=b.cost*(level+1);return `<button data-action="v31-buy" data-value="${b.id}" ${level>=3||p.coins<cost?'disabled':''}><strong>${AC.t(b.title)}</strong><p>${AC.t(b.desc)}</p><small>${level>=3?'已满级':cost+' 星尘 · 当前 '+level+' / 3'}</small></button>`;}).join('')}</div><footer class="modal-footer"><button class="secondary" data-action="close-modal">返回</button></footer>`,true,'shop');};
  UI.openAchievements=function(){const p=AC.V3.profile;this.modal(`<h2 id="dialog-title">成就档案</h2><div class="story-achievements">${AC.V3.ACHIEVEMENTS.map(a=>`<div class="${p.achievements.includes(a.id)?'':'locked'}">${p.achievements.includes(a.id)?'✓':'○'} ${AC.t(a.title)}</div>`).join('')}</div><footer class="modal-footer"><button class="secondary" data-action="close-modal">返回</button></footer>`,true,'achievements');};
  UI.closeModal=function(){const g=this.g;if(g.state==='dialogue'){g.storyCloseDialogue();return;}if(g.state==='story-boon'){g.state='play';g.input.reset();g.audio.pause(false);this.showGame();return;}if(g.state==='story-complete'){g.menu();return;}return old.closeModal.apply(this,arguments);};
  UI.pause=function(){const out=old.pause.apply(this,arguments);if(this.g.mode==='story'){const b=this.root.querySelector('[data-action="restart"]');if(b){b.dataset.action='story-retry';b.textContent='回到营灯（保留目标）';}}return out;};
  UI.click=function(event){
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,g=this.g;
    if(a==='story-quick'){const s=g.v32MemorySave||AC.safeLoad('story',null);g.storyStart(!!s&&!s.complete);return;}
    if(a==='story-continue'){g.storyStart(true);return;}
    if(a==='story-confirm-new'){g.storyStart(false);return;}
    if(a==='start'&&this.pendingMode==='story'){
      const s=g.v32MemorySave||AC.safeLoad('story',null);if(s&&!s.complete)this.modal('<h2 id="dialog-title">替换当前旅程？</h2><p>新旅程会替换主线进度。档案货币、商店能力和成就保留。</p><footer class="modal-footer"><button class="secondary" data-action="story-continue">继续旧旅程</button><button class="launch" data-action="story-confirm-new">开始新旅程</button></footer>',false,'new-story');else g.storyStart(false);return;
    }
    if(a==='story-dialogue-next'){g.storyNextDialogue();return;}if(a==='story-dialogue-close'){g.storyCloseDialogue();return;}
    if(a==='story-boon'){g.storyChooseBoon(b.dataset.value);return;}if(a==='story-boon-skip'){g.state='play';g.input.reset();g.audio.pause(false);this.showGame();return;}
    if(a==='story-retry'){g.kill(g.player);g.resume();return;}
    if(a==='v31-shop'){this.openShop();return;}if(a==='v31-buy'){if(AC.V3.purchase(b.dataset.value))this.openShop();return;}if(a==='v31-achievements'){this.openAchievements();return;}
    if(a==='v31-daily'){g.startChallenge(Math.floor(Date.now()/86400000),null);return;}
    return old.click.call(this,event);
  };
  UI.init=function(game){const out=old.init.call(this,game);css();document.addEventListener('keydown',event=>{if(game.state==='dialogue'&&['Escape','KeyE','Enter','Space'].includes(event.code)){event.preventDefault();event.stopPropagation();if(event.repeat)return;if(event.code==='Escape')game.storyCloseDialogue();else game.storyNextDialogue();}else if(game.state==='story-boon'&&event.code==='Escape'){event.preventDefault();event.stopPropagation();game.state='play';game.input.reset();game.audio.pause(false);this.showGame();}},true);return out;};
  AC.Game.prototype.renderBackdrop=function(){const canvas=document.getElementById('backdrop');if(!canvas)return;const w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,1.5);if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);}const ctx=canvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle=this.theme?.colors[0]||'#071014';ctx.fillRect(0,0,w,h);};
  Object.assign(AC.ZH,{'achievement.firstParry':'第一次成功振刀','achievement.firstDodge':'第一次完美闪避','achievement.firstClash':'第一次攻击角力','achievement.firstSecret':'发现隐藏星标','achievement.firstPurchase':'购买星灯能力','achievement.storyComplete':'完成六章冒险'});
})();
;
'use strict';
(()=>{
 try{
  const g=new AC.Game(document.getElementById('game'));AC.game=g;AC.UI.init(g);
  if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)g.settings.motion=false;
  // Stable inspection surface for automated tests and future development.
  AC.inspect=()=>({version:AC.VERSION,state:g.state,mode:g.mode,wave:g.wave,score:g.survivalScore,gamepad:g.input.activePadIndex>=0,time:g.time,entities:g.fighters.length,platforms:g.platforms.length,projectiles:g.projectiles.length,player:g.player?{x:g.player.x,y:g.player.y,hp:g.player.hp,pct:g.player.pct,stocks:g.player.stocks,core:g.player.core,sigils:g.player.sigils}:null,run:g.run?{keys:g.run.keys,coins:g.run.coins,width:g.worldWidth,seed:g.run.seed,defeated:g.run.defeated.size}:null});
 }catch(e){console.error(e);const el=document.createElement('pre');el.className='boot-error';el.textContent='ASTRAL CLASH could not start.\n'+e.message+'\n'+e.stack;document.body.appendChild(el);}
})();
</script>
