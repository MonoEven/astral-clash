 },

  if(this.modalKind==='boon'||this.modalKind==='result')return;
  this.g.input.cancelRemap?.();this.root.querySelector('.modal-backdrop')?.remove();const kind=this.modalKind;this.modalKind=null;

   else{if(this.shell.requestFullscreen)await this.shell.requestFullscreen({navigationUI:'hide'});else if(this.shell.webkitRequestFullscreen)this.shell.webkitRequestFullscreen();else{this.g.toast(this.text.fullscreenUnavailable);return;}try{await screen.orientation?.lock?.('landscape');}catch(_){}}
  }catch(_){this.g.toast(this.text.fullscreenUnavailable);}finally{this.resize();}
 },
 navigate(command){
  const g=this.g;
  if(g.state==='map'){if(['map','back','start','confirm'].includes(command))g.resume();return;}
  if(command==='back'){if(this.modalKind)this.closeModal();else if(this.screen==='setup')g.menu();return;}
  if(command==='start'){if(this.modalKind==='boon'||this.modalKind==='result')command='confirm';else if(this.modalKind)this.closeModal();else if(this.screen==='setup')this.root.querySelector('[data-action="start"]')?.click();else command='confirm';if(command!=='confirm')return;}
  const scope=this.root.querySelector('.modal')||this.root,items=[...scope.querySelectorAll('button:not(:disabled),select:not(:disabled),input:not(:disabled)')].filter(el=>!el.closest('[hidden]')&&el.getClientRects().length&&getComputedStyle(el).visibility!=='hidden');if(!items.length)return;
  let current=items.includes(document.activeElement)?document.activeElement:scope.querySelector('.mode-button.primary,[data-action="start"],[data-action="resume"],.boon-card')||items[0];
  if(command==='confirm'){if(current.tagName==='SELECT'){current.selectedIndex=(current.selectedIndex+1)%current.options.length;current.dispatchEvent(new Event('change',{bubbles:true}));}else current.click();return;}
  if(!['left','right','up','down'].includes(command))return;
  const sign=['left','up'].includes(command)?-1:1;
  if(['left','right'].includes(command)&&(current.tagName==='SELECT'||current.type==='range')){
   if(current.tagName==='SELECT'){current.selectedIndex=(current.selectedIndex+sign+current.options.length)%current.options.length;current.dispatchEvent(new Event('change',{bubbles:true}));}
   else{current.value=AC.clamp(+current.value+sign*(+current.step||1),+current.min,+current.max);current.dispatchEvent(new Event('input',{bubbles:true}));}return;
  }
  const r=current.getBoundingClientRect(),horizontal=command==='left'||command==='right',cx=r.x+r.width/2,cy=r.y+r.height/2;
  const candidates=items.filter(el=>el!==current).map(el=>{const b=el.getBoundingClientRect(),dx=b.x+b.width/2-cx,dy=b.y+b.height/2-cy,forward=horizontal?dx*sign:dy*sign,cross=horizontal?Math.abs(dy):Math.abs(dx);return {el,forward,score:forward+cross*2.5};}).filter(x=>x.forward>5).sort((a,b)=>a.score-b.score);
  const target=candidates[0]?.el||items[(items.indexOf(current)+sign+items.length)%items.length];scope.querySelectorAll('.pad-focus').forEach(el=>el.classList.remove('pad-focus'));target.classList.add('pad-focus');target.focus({preventScroll:true});target.scrollIntoView({block:'nearest',inline:'nearest'});

  const dialog=this.root.querySelector('.modal');if(e.key==='Tab'&&dialog){const items=[...dialog.querySelectorAll('button:not(:disabled),input,select')].filter(x=>!x.closest('[hidden]'));if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0]?.focus();}}

 update(dt=0){
  this.syncTouchVisibility();this.uiClock+=dt;if(this.uiClock<.08)return;this.uiClock=0;const g=this.g,p=g.player,i=g.input;
  if(this.compact&&p&&this.screen==='game'){
   const el=this.root.querySelector('.compact-hud');if(el){const mode=g.mode==='survival'?this.T('wave')+' '+g.wave+'/12 / '+this.T('wave.'+g.waveVariant):g.mode==='expedition'?this.T('fragment')+' '+g.run.keys+'/3':g.mode==='battle'?Math.floor(Math.ceil(Math.max(0,g.remaining))/60)+':'+String(Math.ceil(Math.max(0,g.remaining))%60).padStart(2,'0'):this.T('training');
    const extra=g.mode==='survival'?this.text.score+' '+Math.floor(g.survivalScore)+' / '+Math.max(0,Math.ceil(g.remaining))+'s':g.mode==='expedition'?Math.ceil(p.hp)+' / '+p.maxhp+' HP':this.T('resonance')+' '+Math.floor(p.meter)+'%';
    el.innerHTML=`<div class="hud-player"><strong style="color:${p.hero.color}">${Math.floor(p.pct)}%</strong><span>${g.mode==='battle'&&g.rule.scoring?this.text.score+' '+(p.score||0):this.text.lives+' '+p.stocks}</span></div><div class="hud-meta"><b>${mode}</b><span>${extra}</span></div><div class="hud-enemies">${g.mode==='expedition'?'':g.fighters.filter(f=>f!==p).map(f=>`<span style="--fighter:${f.hero.color}" class="${f.eliminated?'out':''}">${g.rule.scoring?(f.score||0)+' PT':Math.floor(f.pct)+'<small>%</small>'}</span>`).join('')}</div>`;
   }
  }
  if(p&&this.touchReady){for(const [action,cd] of [['primary',p.skillsCD[0]],['secondary',p.skillsCD[1]],['dash',p.dashCD],['recover',p.recoveryUsed?1:0],['ultimate',p.meter>=100?0:1]]){const b=this.touchRoot.querySelector('[data-touch-action="'+action+'"]');if(!b)continue;b.classList.toggle('cooling',cd>0);b.querySelector('.touch-cooldown').textContent=['primary','secondary'].includes(action)&&cd>.05?cd.toFixed(1):action==='ultimate'?Math.floor(p.meter)+'%':'';}}

  const status=this.root.querySelector('[data-controller-status]');if(status){const fingerprint=JSON.stringify((i.availablePads||[]).map(p=>[p.index,p.id]));if(fingerprint!==this.padFingerprint){this.settings('controller');return;}const active=(i.availablePads||[]).find(p=>p.index===i.activePadIndex);status.textContent=i.activePadIndex<0?this.text.disconnected:(active?.mapping==='standard'?this.text.standard:i.padUncalibrated?this.text.custom:this.text.calibrated);status.title=i.gamepadName||'';}
  const remap=this.root.querySelector('.mapping-status');if(remap){const active=i.remapping||i.remapAction;remap.textContent=active?this.text.waiting+' / '+(typeof active==='string'?(this.text[active]||active):''):'';this.root.querySelector('[data-action="cancel-mapping"]').hidden=!active;}
 },
 click(e){
  const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,g=this.g;g.audio.init();if(a!=='mute')g.audio.play('ui');

  if(a==='tab'){this.tab=b.dataset.tab;this.setup();this.root.querySelector('[data-tab="'+this.tab+'"]')?.focus();}
  if(['hero','core','arena'].includes(a)){const v=+b.dataset.value;g.config[a]=v;if(a==='arena')g.theme=AC.ARENAS[v];AC.safeSave('config',g.config);this.setup();this.root.querySelector(`[data-action="${a}"][data-value="${v}"]`)?.focus({preventScroll:true});}

 },

(()=>{
